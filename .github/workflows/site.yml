name: Validar e publicar site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_AUTH_ORIGIN: ${{ vars.CMS_AUTH_ORIGIN || 'https://caiomatos-cms-auth.cicpmatos.workers.dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Conferir ativação do painel
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const runtime = JSON.parse(await readFile('_site/admin/runtime-config.json', 'utf8'));
          const expectedOrigin = new URL(process.env.CMS_AUTH_ORIGIN).origin;
          assert.equal(runtime.enabled, true, 'O painel deve estar habilitado antes da publicação.');
          assert.equal(runtime.authOrigin, expectedOrigin, 'O painel deve usar a origem de login configurada.');
          console.log(`Painel habilitado com o serviço de login ${expectedOrigin}.`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
